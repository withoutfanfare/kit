    <!--
      THESIS: Kit is a product tool, not a themed one. It refuses the previous
      pass's mistake — a metaphor (a distribution board) dressed over the app
      and never detailed. Craft level: Linear. Identity: Kit's own.
      OWN-WORLD: Inter throughout, no display face in UI labels. Surfaces are
      white/black alpha layers on a near-black or soft-neutral ground, never
      flat greys. Terracotta accent taken from Kit's own app icon. Definition
      from inset rings and elevation, not hairlines. Radius 6 controls, 8 panels.
      STORY: The user opens on Panel, reads what loads and what it costs, and
      goes to a location, the library or Health to change it.
      FIRST VIEWPORT: Location picker, the session's token figure at 34px, a
      proportion meter by source, alerts only when there are any, then sources.
      FORM: Product design system; pinned brief (Linear craft, Kit identity).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->

    <script type="module" src="/src/main.ts"></script>
  </body>
