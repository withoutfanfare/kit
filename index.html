    <!--
      THESIS: Kit is the panel schedule for a Claude Code session — every circuit
      named, rated and switched, with unsurveyed sources kept outside the total.
      It refuses the dev-dashboard rut: no stat-tile grid, no neon on near-black.
      OWN-WORLD: Machine-grey ground (enamel in dark), oxide-green accent, copper
      reserved for the live bus, amber only for lock-out and conflict. Engraved
      legend plates in tracked Archivo Narrow caps; system face for interface text;
      tabular numerals for every rating. Hairline rules, no bevels, no brushed metal.
      STORY: The user reads what is energised, what it draws and what is tagged out,
      then opens a sub-panel to change a circuit, previews, and throws the switch.
      FIRST VIEWPORT: A rated capacity strip across the top, segmented by source and
      labelled on plates; the schedule below it — position, plate, rating, state;
      unsurveyed sources banded beneath the total. Primary action sits panel-top-right.
      FORM: Panel schedule, 3rd of seven grounded directions; seed key aa45fed1.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
